<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>模构智脑</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#0D0D0B;color:#F0EDE8;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh}
.nav{height:48px;background:#161614;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;padding:0 1rem;flex-shrink:0}
.lb{width:28px;height:28px;background:#6A9E2F;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-right:.5rem;flex-shrink:0}
.nav span{font-size:14px;font-weight:600}
.on{margin-left:auto;font-size:10px;color:#8BC34A;padding:.25rem .55rem;border-radius:8px;background:rgba(139,195,74,.1)}
.pb{flex-shrink:0;background:linear-gradient(90deg,#3d5c14,#5A8A2A);display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem}
.pb span{flex:1;font-size:12px;color:#fff;line-height:1.5}
.pb b{color:#EFFFD0}
.pb button{background:none;border:none;color:rgba(255,255,255,.7);font-size:14px;cursor:pointer;padding:.2rem .4rem;flex-shrink:0}
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:.75rem;display:flex;flex-direction:column;gap:.55rem;-webkit-overflow-scrolling:touch}
.msg{display:flex;gap:7px;align-items:flex-start}
.msg.u{flex-direction:row-reverse}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;background:#6A9E2F;color:#fff}
.av.u{background:#3A3A35}
.bbl{padding:.6rem .85rem;font-size:13px;line-height:1.8;max-width:88%;white-space:pre-wrap;word-break:break-word;background:#161614;border:1px solid rgba(255,255,255,.07);border-radius:3px 10px 10px 10px}
.msg.u .bbl{background:#5A8A2A;color:#fff;border-radius:10px 3px 10px 10px}
.case{margin:.2rem 0 .2rem 33px;background:#12160f;border:1px solid rgba(139,195,74,.3);border-radius:12px;padding:.9rem 1rem;max-width:88%}
.case h4{font-size:13px;color:#8BC34A;margin-bottom:.6rem}
.case .row{display:flex;gap:8px;font-size:12.5px;line-height:1.7;margin-bottom:.35rem}
.case .row b{color:#F0EDE8;font-weight:600}
.case .row span{color:rgba(240,237,232,.65)}
.case .ck{color:#8BC34A;flex-shrink:0}
.case .note{margin-top:.6rem;padding:.55rem .7rem;background:rgba(139,195,74,.08);border-radius:8px;font-size:12px;color:#CDE8A8;line-height:1.7}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.2rem 0 .2rem 33px;max-width:88%}
.tgi{border-radius:12px;padding:.8rem .7rem;cursor:pointer;border:1px solid rgba(255,255,255,.09);position:relative;overflow:hidden}
.tgi:active{transform:scale(.97)}
.tgi .tge{font-size:22px;margin-bottom:.35rem}
.tgi .tgt{font-size:12.5px;font-weight:600;color:#F0EDE8;line-height:1.4}
.tgi .tgs{font-size:10.5px;color:rgba(240,237,232,.55);margin-top:.15rem;line-height:1.4}
.tg1{background:linear-gradient(135deg,#1d2a10,#26380f)}
.tg2{background:linear-gradient(135deg,#102025,#0f2e33)}
.tg3{background:linear-gradient(135deg,#291d10,#3a260c)}
.tg4{background:linear-gradient(135deg,#22102a,#2e0f33)}
.qw{padding:.3rem .75rem;display:flex;flex-wrap:wrap;gap:.3rem}
.qr{padding:.3rem .7rem;border-radius:12px;font-size:12px;border:1px solid rgba(139,195,74,.3);color:#8BC34A;cursor:pointer;background:rgba(139,195,74,.06)}
.ia{padding:.65rem .75rem;border-top:1px solid rgba(255,255,255,.07);background:#161614;display:flex;gap:.5rem;flex-shrink:0}
.ii{flex:1;padding:.55rem .85rem;background:#1E1E1B;border:1px solid rgba(255,255,255,.13);border-radius:20px;color:#F0EDE8;font-size:14px;font-family:Arial,sans-serif;-webkit-appearance:none}
.ii:focus{outline:none;border-color:#8BC34A}
.sb{width:36px;height:36px;border-radius:50%;background:#6A9E2F;color:#fff;border:none;cursor:pointer;font-size:15px;flex-shrink:0}
.sb:disabled{opacity:.4}
.rc{margin:.4rem 0 .4rem 33px;background:#0f2010;border:1px solid rgba(139,195,74,.35);border-radius:12px;padding:.85rem 1rem}
.rc a{color:#8BC34A;font-size:13px;font-weight:600;text-decoration:none;display:block;margin-bottom:.3rem}
.rc span{color:rgba(240,237,232,.55);font-size:11px;line-height:1.7}
.tp{display:flex;gap:5px;align-items:center;padding:.7rem .9rem;background:#161614;border:1px solid rgba(255,255,255,.07);border-radius:3px 10px 10px 10px;width:fit-content}
.tp i{width:6px;height:6px;border-radius:50%;background:#8BC34A;animation:tb 1.2s infinite;font-style:normal}
.tp i:nth-child(2){animation-delay:.2s}
.tp i:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
</style>
</head>
<body>
<nav class="nav">
  <div class="lb">MG</div>
  <span>模构智脑</span>
  <div class="on">● 在线服务中</div>
</nav>
<!-- 促销横幅:改文字就改下面这一行,不想要就整个删掉这个div -->
<div class="pb" id="PB">
  <span>🎁 本月新用户福利：注册即送 <b>3条免费AI视频</b> 生成额度，先到先得</span>
  <button onclick="document.getElementById('PB').style.display='none'">✕</button>
</div>
<div class="msgs" id="M"></div>
<div id="Q"></div>
<div class="ia">
  <input class="ii" id="I" placeholder="随时问我，我来帮您..." type="text"/>
  <button class="sb" id="S">&#8594;</button>
</div><script>
var H=[];

function am(r,t){
  var m=document.getElementById('M');
  var d=document.createElement('div');d.className='msg '+r;
  var a=document.createElement('div');a.className='av'+(r==='u'?' u':'');
  a.textContent=r==='ai'?'模':'您';
  var b=document.createElement('div');b.className='bbl';
  var hasLink=t.indexOf('[LINK]')>=0;
  var clean=t.replace(/\[LINK\]/g,'').replace(/\*\*/g,'').replace(/\*/g,'').trim();
  b.textContent=clean;
  d.appendChild(a);d.appendChild(b);
  m.appendChild(d);
  if(hasLink){
    var rc=document.createElement('div');rc.className='rc';
    rc.innerHTML='<a href="https://mogouzhineng.com/ai/" target="_blank">立即免费体验 → mogouzhineng.com/ai/</a><span>或微信搜索小程序：模构AI</span>';
    m.appendChild(rc);
  }
  setTimeout(function(){m.scrollTop=m.scrollHeight;},50);
}

function addCase(){
  var m=document.getElementById('M');
  var c=document.createElement('div');c.className='case';
  c.innerHTML='<h4>🏭 佛山某家具工厂 · 昨日数据</h4>'
  +'<div class="row"><span class="ck">✓</span><div><b>上传1张沙发实拍图</b> <span>→ 10秒生成6种颜色版本</span></div></div>'
  +'<div class="row"><span class="ck">✓</span><div><b>场景替换</b> <span>→ 放进5个不同风格的客厅场景</span></div></div>'
  +'<div class="row"><span class="ck">✓</span><div><b>视频分镜工坊</b> <span>→ 25宫格分镜+完整拍摄脚本</span></div></div>'
  +'<div class="row"><span class="ck">✓</span><div><b>电商详情页</b> <span>→ 一套完整详情页自动生成</span></div></div>'
  +'<div class="note">全程没有摄影师、没有设计师参与。这些工作传统方式要花 ¥3,000+ 和 3 天时间。</div>';
  m.appendChild(c);
  setTimeout(function(){m.scrollTop=m.scrollHeight;},50);
}

// ===== 话题格子:想改内容就改下面 items 里的文字和问题 =====
function addTopics(){
  var m=document.getElementById('M');
  var g=document.createElement('div');g.className='tg';
  var items=[
    {c:'tg1',e:'🎬',t:'视频分镜工坊',s:'7分钟出一条广告视频',q:'视频分镜工坊是怎么用的？'},
    {c:'tg2',e:'🛒',t:'电商详情页',s:'AI一键生成，配图+文案全包',q:'电商详情页功能是怎么用的？'},
    {c:'tg3',e:'🧑‍💼',t:'数字人视频',s:'无需真人出镜，文字一键出片',q:'数字人视频是怎么做的？'},
    {c:'tg4',e:'💰',t:'价格方案',s:'看看哪个版本适合我',q:'模构AI的价格方案是怎样的？'}
  ];
  items.forEach(function(it){
    var d=document.createElement('div');d.className='tgi '+it.c;
    d.innerHTML='<div class="tge">'+it.e+'</div><div class="tgt">'+it.t+'</div><div class="tgs">'+it.s+'</div>';
    d.onclick=function(){st(it.q);};
    g.appendChild(d);
  });
  m.appendChild(g);
  setTimeout(function(){m.scrollTop=m.scrollHeight;},50);
}

function sq(opts){
  var q=document.getElementById('Q');q.innerHTML='';
  if(!opts||!opts.length)return;
  var w=document.createElement('div');w.className='qw';
  opts.forEach(function(o){
    var b=document.createElement('button');b.className='qr';b.textContent=o;
    b.onclick=function(){q.innerHTML='';st(o);};
    w.appendChild(b);
  });
  q.appendChild(w);
}

function showTp(){
  hideTp();
  var m=document.getElementById('M');
  var d=document.createElement('div');d.className='msg ai';d.id='TP';
  var a=document.createElement('div');a.className='av';a.textContent='模';
  var b=document.createElement('div');b.className='tp';
  b.innerHTML='<i></i><i></i><i></i>';
  d.appendChild(a);d.appendChild(b);
  m.appendChild(d);
  setTimeout(function(){m.scrollTop=m.scrollHeight;},50);
}
function hideTp(){
  var t=document.getElementById('TP');
  if(t)t.parentNode.removeChild(t);
}

function st(text){
  document.getElementById('Q').innerHTML='';
  am('u',text);
  document.getElementById('I').value='';
  document.getElementById('S').disabled=true;
  H.push({role:'user',content:text});
  if(H.length>20)H=H.slice(-20);
  showTp();
  sendReq(0);
}

function sendReq(attempt){
  fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:H})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var t=(d.content||[]).map(function(b){return b.text||'';}).join('');
    if(!t)throw new Error('empty');
    hideTp();
    document.getElementById('S').disabled=false;
    H.push({role:'assistant',content:t});
    am('ai',t);
    var round=Math.floor(H.length/2);
    if(round===1)sq(['内容成本太高','产量不够','想了解怎么用']);
    else if(round>=2)sq(['想马上体验','想了解价格','想联系顾问']);
  })
  .catch(function(){
    if(attempt<1){
      setTimeout(function(){sendReq(attempt+1);},1500);
      return;
    }
    hideTp();
    document.getElementById('S').disabled=false;
    am('ai','人有点多，小模忙不过来了，请稍等几秒再发一次哦～');
  });
}

document.getElementById('S').onclick=function(){
  var v=document.getElementById('I').value.trim();if(v)st(v);
};
document.getElementById('I').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();var v=this.value.trim();if(v)st(v);}
});

am('ai','直播间来的朋友，您好呀！我是模构AI的小助手小模 👋\n\n先给您看一个真实案例：\n\n一家佛山家具工厂，昨天在模构AI做了这几件事 👇');
addCase();
am('ai','您最想了解哪个功能？点下面的卡片，或者直接告诉我您是做什么行业的 👇');
addTopics();
sq(['我做家具建材','我是室内设计师','我做短视频','我是电商卖家','我是品牌方']);
</script>
</body>
</html>
